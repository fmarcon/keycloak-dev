<VirtualHost *:80>

	ServerName ${HOSTNAME}
	ServerAdmin ${PHPLDAPADMIN_SERVER_ADMIN}
	ServerPath ${PHPLDAPADMIN_SERVER_PATH}

	DocumentRoot /var/www/phpldapadmin/htdocs

	# Servir tambem em /phpldapadmin para acesso via proxy do nginx
	# (subpath): o phpLDAPadmin gera links baseado no SCRIPT_NAME, entao
	# o prefixo precisa chegar na aplicacao.
	Alias /phpldapadmin /var/www/phpldapadmin/htdocs

	Include /etc/apache2/conf-available/gzip.conf
	Include /etc/apache2/conf-available/cache.conf

	<Directory /var/www/phpldapadmin/htdocs >
		Require all granted
	</Directory>

	<files config.php >
		Require all denied
	</files>

</VirtualHost>