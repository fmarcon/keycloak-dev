services:
  postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak} -d ${POSTGRES_DB:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      keycloak-net:
        ipv4_address: 172.28.0.10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      # Trafego interno nginx -> keycloak e HTTP simples; TLS termina no nginx.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auk.ucs.br}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      openldap:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      keycloak-net:
        ipv4_address: 172.28.0.20

  openldap:
    # LDAP de dev (dados fake Futurama / planetexpress.com), imagem propria
    # construida de ./ldap (baseada no rroemhild/docker-test-openldap, MIT).
    # Seed unico no primeiro boot; dados persistem nos volumes nomeados.
    # LDAP_RESEED=1 (env do container) apaga e re-semeia (entryUUIDs mudam).
    build: ./ldap
    image: keycloak-dev-openldap:latest
    container_name: keycloak-openldap
    restart: unless-stopped
    environment:
      # 1 = apaga e re-semeia o LDAP no proximo boot (entryUUIDs mudam)
      LDAP_RESEED: "${LDAP_RESEED:-false}"
    volumes:
      - keycloak_openldap_data:/var/lib/ldap
      - keycloak_openldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldap://127.0.0.1:10389 -D 'cn=admin,dc=planetexpress,dc=com' -w GoodNewsEveryone -b 'dc=planetexpress,dc=com' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      keycloak-net:
        ipv4_address: 172.28.0.40

  phpldapadmin:
    # Web UI para navegar/editar o LDAP (dev).
    # Login: cn=admin,dc=planetexpress,dc=com / GoodNewsEveryone
    image: osixia/phpldapadmin:latest
    container_name: keycloak-phpldapadmin
    restart: unless-stopped
    environment:
      # osixia so interpreta estrutura se prefixado com #PYTHON2BASH:
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'openldap': [{'server': [{'port': 10389}]}]}]"
      PHPLDAPADMIN_HTTPS: "false"
      PHPLDAPADMIN_LDAP_CLIENT_TLS_REQCERT: "never"
    ports:
      - "${PHPLDAPADMIN_PORT:-8081}:80"
    volumes:
      # Volume nomeado: sem isso a imagem cria volume anonimo e o config
      # gerado sobrevive a recriacao do container (config velho/errado).
      - keycloak_phpldapadmin_data:/var/www/phpldapadmin
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      keycloak-net:
        ipv4_address: 172.28.0.50

  nginx:
    image: nginx:1.27-alpine
    container_name: keycloak-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      keycloak:
        condition: service_started
    networks:
      keycloak-net:
        ipv4_address: 172.28.0.30

volumes:
  keycloak_postgres_data:
    name: keycloak_postgres_data
  keycloak_openldap_data:
    name: keycloak_openldap_data
  keycloak_openldap_config:
    name: keycloak_openldap_config
  keycloak_phpldapadmin_data:
    name: keycloak_phpldapadmin_data

networks:
  keycloak-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
